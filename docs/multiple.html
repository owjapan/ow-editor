<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>複数フィールドのデモ — OWEditor</title><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="releases/0.1.0/ow-editor.css"><script type="module" src="assets/multiple.mjs"></script></head>
<body>
  <a class="skip" href="#main">本文へ</a>
  <header class="site-header"><nav class="nav shell" aria-label="メインナビゲーション"><a class="brand" href="./"><img src="assets/logo.svg" width="30" height="30" alt="">OWEditor <span class="version">0.1.0 Preview</span></a><div class="nav-links"><a href="./#features">機能紹介</a><a href="demo.html">記事編集</a><a class="current" href="multiple.html" aria-current="page">複数フィールド</a><a href="https://github.com/owjapan/ow-editor">GitHub ↗</a></div></nav></header>
  <main id="main" class="shell demo-main">
    <div class="demo-heading"><p class="eyebrow">ES MODULE EXAMPLE</p><h1>ひとつのフォームに、ふたつの本文。</h1><p class="muted">概要と詳細を独立して編集します。下書きを分け、一方が設定中なら、まとめての保存を止めます。</p></div>
    <aside class="demo-note">このサンプルはES module版を使用しています。「画面内に保存」は表示の更新だけを行い、本文をサーバーへ送信しません。</aside>
    <form id="article-form" action="#">
      <label class="field-label" for="summary">概要</label><textarea id="summary" name="summary" readonly><p>今週のおすすめをご紹介します。</p></textarea>
      <label class="field-label" for="body">詳細</label><textarea id="body" name="body" readonly><h2>予定を立てる時間も、楽しみに。</h2><p>行ってみたい場所、気になるお店。思いついたことから書いてみましょう。</p></textarea>
      <p id="init-error" role="alert">エディターを読み込んでいます。</p>
      <div class="demo-actions"><button type="submit" class="button primary" disabled>ふたつの本文を画面内に保存</button><span id="save-result" role="status"></span></div>
    </form>
    <details id="html-result"><summary>保存した内容を見る</summary><pre id="result"></pre></details>
  </main>
  <footer class="shell footer"><a href="demo.html">← 記事編集を試す</a><p>OWEditor 0.1.0 · Public preview</p><a href="https://github.com/owjapan/ow-editor">ソースを見る ↗</a></footer>
</body></html>
